name: benchmark
# Manual only. Clones public repositories (read-only, nothing is executed) and compares
# VigilSutra with Gitleaks and Semgrep on the same commits. Results are uploaded as an artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: bash benchmarks/ci-compare.sh out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: out/
          retention-days: 30
