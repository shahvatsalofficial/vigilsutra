name: VigilSutra
description: Offline read-only security and privacy audit. Writes vigilsutra.sarif in the workspace.
inputs:
  path:
    description: Directory to scan
    required: false
    default: "."
  fail-on:
    description: Exit 1 when a finding is at or above this severity
    required: false
    default: high
  history:
    description: Read git objects for removed secrets (true or false)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install VigilSutra
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Audit
      shell: bash
      env:
        VS_PATH: ${{ inputs.path }}
        VS_FAIL: ${{ inputs.fail-on }}
        VS_HISTORY: ${{ inputs.history }}
      run: |
        set -eu
        args=(audit "$VS_PATH" --fail-on "$VS_FAIL" --format sarif --out vigilsutra.sarif --no-report)
        if [ "$VS_HISTORY" != "true" ]; then
          args+=(--no-history)
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
