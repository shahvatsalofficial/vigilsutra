version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Types must match the oldest Node line we promise to support, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
