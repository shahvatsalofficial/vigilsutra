# Self-audit policy. Rule definitions and tests contain deliberately secret-shaped
# strings, so they are excluded; fixtures are generated at test time.
version: 1
ignore:
  - src/rules/**
  - src/redact.ts
  - dist/rules/**
  - dist/redact.js
  - test/**
  - docs/rules.md
  - examples/intentionally-insecure/**
  - examples/sample-reports/**
  - docs/assurance/**
  - benchmarks/**
  - docs/launch-kit.md
