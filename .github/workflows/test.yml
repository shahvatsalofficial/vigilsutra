name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is not in this matrix. On 2026-11-04 those jobs stayed queued
        # and were cancelled with zero steps (runs 41882166871, 41885847962, 41886196642),
        # which failed the check before any test ran. The suite is plain Node with no native addon.
        # Ubuntu and Windows cover the same tests, including case-insensitive git index matching.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24, 26]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run audit:self
      - name: Audit inside a network namespace with no interfaces (Linux only)
        if: runner.os == 'Linux'
        run: |
          cat > /tmp/offline.sh <<'SCRIPT'
          # 1. prove the namespace really has no network: a request must fail
          if node -e "fetch('http://example.com').then(() => process.exit(0), () => process.exit(1))"; then
            echo "namespace unexpectedly has network access"; exit 1
          fi
          # 2. the audit must still succeed
          node dist/cli.js audit examples/intentionally-insecure --format sarif --out /tmp/vs.sarif
          test -s /tmp/vs.sarif
          SCRIPT
          sudo unshare --net -- env "PATH=$PATH" sh /tmp/offline.sh
