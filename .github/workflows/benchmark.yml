name: benchmark
# Manual only. Clones public repositories (read-only, nothing is executed) and compares
# VigilSutra with Gitleaks and Semgrep on the same commits. Results are uploaded as an artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: bash benchmarks/ci-compare.sh out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: out/
          retention-days: 30
