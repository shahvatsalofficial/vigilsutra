name: VigilSutra
description: Offline read-only security and privacy audit. Writes vigilsutra.sarif in the workspace.
inputs:
  path:
    description: Directory to scan
    required: false
    default: "."
  fail-on:
    description: Exit 1 when a finding is at or above this severity
    required: false
    default: high
  history:
    description: Read git objects for removed secrets (true or false)
    required: false
    default: "true"
outputs:
  total:
    description: Number of findings
    value: ${{ steps.audit.outputs.total }}
  critical:
    description: Number of critical findings
    value: ${{ steps.audit.outputs.critical }}
  high:
    description: Number of high findings
    value: ${{ steps.audit.outputs.high }}
runs:
  using: composite
  steps:
    - name: Install VigilSutra
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Audit
      id: audit
      shell: bash
      env:
        VS_PATH: ${{ inputs.path }}
        VS_FAIL: ${{ inputs.fail-on }}
        VS_HISTORY: ${{ inputs.history }}
        VS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      run: |
        set -eu
        reports="$(mktemp -d)"
        args=(audit "$VS_PATH" --fail-on "$VS_FAIL" --format sarif --out vigilsutra.sarif --report-dir "$reports" --annotate)
        if [ "$VS_HISTORY" != "true" ]; then
          args+=(--no-history)
        fi
        # A pull request must not loosen its own gate: take .vigilsutra.yml from the base commit.
        # If the base commit or its policy file cannot be read, the built-in defaults apply.
        if [ -n "${VS_BASE:-}" ]; then
          git -C "$VS_PATH" cat-file -e "$VS_BASE^{commit}" 2>/dev/null ||
            git -C "$VS_PATH" fetch --quiet --no-tags --depth=1 origin "$VS_BASE" ||
            echo "::warning::VigilSutra could not fetch the base commit; the project policy is ignored."
          trusted="$(mktemp)"
          if git -C "$VS_PATH" show "$VS_BASE:./.vigilsutra.yml" >"$trusted" 2>/dev/null; then
            args+=(--policy "$trusted")
          else
            args+=(--no-policy)
          fi
        fi
        status=0
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" || status=$?
        # GitHub limits a job summary to 1 MiB.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$reports/report.md" ]; then
          head -c 900000 "$reports/report.md" >>"$GITHUB_STEP_SUMMARY"
        fi
        if [ -n "${GITHUB_OUTPUT:-}" ] && [ -f "$reports/results.json" ]; then
          node -e 'const s = require(process.argv[1]).summary; console.log(`total=${s.total}\ncritical=${s.bySeverity.critical}\nhigh=${s.bySeverity.high}`)' "$reports/results.json" >>"$GITHUB_OUTPUT"
        fi
        exit "$status"
